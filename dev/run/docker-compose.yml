# =============================================================================
# settings-center-app dev stack
#
# Mirrors the service topology of template-root/root/docker-compose.yml (the
# real PCS `yundera` stack) closely enough that the auth flow you exercise here
# is the auth flow that ships:
#
#   browser ──► admin-${DOMAIN}        (this app, Next.js dev mode)
#                  │ OIDC
#                  ▼
#              auth-${DOMAIN}          Dex — the broker every PCS app talks to
#                  │ "Local Account" connector
#                  ▼
#           local-auth-${DOMAIN}       Authelia — the local credential store
#                                      (users_database.yml lives here)
#
# The template tree comes from the LOCAL packages/template-root checkout, not a
# GitHub zip, so unpushed script changes are visible immediately.
#
#   cp .env.example .env      # then edit
#   docker compose up -d --build
#   # browse https://admin-dev.localhost   (log in as admin / DEFAULT_PWD)
#
# See README.md. `docker compose down -v` for a clean slate.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # pcs-host — the simulated PCS VM.
  #
  # Owns the template tree, runs the provisioning scripts, and is the SSH target
  # for every privileged operation the dashboard performs. Must come up fully
  # before anything else: it mints the TLS certs Caddy serves and renders both
  # Authelia's and Dex's configs.
  # ---------------------------------------------------------------------------
  pcs-host:
    build: .
    container_name: pcs-host
    hostname: pcs-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bootstrap.sh:/opt/bootstrap.sh:ro
      # The local template-root working tree — the point of the whole harness.
      - ../../../template-root/root:/tmp/template-src:ro
      - ./.env:/tmp/dev.env:ro
      - ssh_keys:/home/admin/.ssh/
      - data:/DATA/AppData/casaos/apps/yundera/
      - auth_data:/DATA/AppData/yundera/auth/
      - dex_data:/DATA/AppData/yundera/dex/
      - dex_frontend:/DATA/AppData/yundera/dex-frontend/
      - certs:/certs
    healthcheck:
      # Gates every dependent: certs, Authelia config + users_database.yml, and
      # Dex config must all exist before those containers try to read them.
      test: ["CMD-SHELL", "test -f /tmp/bootstrap-ready"]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 20s
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # admin — the AppShield gate, mirroring template-root's yundera stack.
  #
  # Container name MUST be `admin`: auth-registrar derives the OIDC client id
  # from a PTR lookup on the caller's IP, and the redirect-URI allowlist is built
  # from `<name>-<suffix>`. The gate is now the caller, so the gate takes the
  # name and the app under test becomes `admin-app` — same swap the prod template
  # made. Routed only through Caddy: no localhost port mapping, because the OIDC
  # redirect URI is HTTPS-only.
  #
  # This is what makes the harness worth having: the login path exercised here is
  # the same gate the fleet runs, including the identity assertion the app
  # verifies. `ADMIN_ASSERTION_SECRET` is a dev constant from .env rather than a
  # generated secret — the prod value is minted by
  # ensure-admin-gate-secret.sh.
  # ---------------------------------------------------------------------------
  admin:
    image: ghcr.io/yundera/appshield:2.2.0
    container_name: admin
    hostname: admin
    restart: unless-stopped
    environment:
      APP_NAME: "admin"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${DOMAIN}"
      BACKEND_HOST: "admin-app"
      # Dev mode listens on 4342 (server.ts); prod on 80.
      BACKEND_PORT: "4342"
      LISTEN_PORT: "80"
      SESSION_DURATION_HOURS: "720"
      IDENTITY_ASSERTION_SECRET: ${ADMIN_ASSERTION_SECRET:-dev-admin-gate-secret}
      ALLOWED_PATHS: "api/health,api/perf,api/bench,api/brand"
      # Next.js dev mode serves fast-refresh over a websocket and a lot of
      # uncached chunks; buffering off keeps HMR responsive.
      PROXY_BUFFERING: "off"
    volumes:
      - gate_data:/data
      - certs:/certs:ro
    networks:
      - app-network
    depends_on:
      - admin-app
    labels:
      caddy_0: admin-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"

  # ---------------------------------------------------------------------------
  # admin-app — settings-center-app under test, behind the gate above.
  # No caddy labels: the gate is the only route in.
  # ---------------------------------------------------------------------------
  admin-app:
    build:
      context: ../../
      dockerfile: dev/run/Dockerfile.admin-dev
    container_name: admin-app
    hostname: admin-app
    env_file:
      - ./.env
    environment:
      HOST_ADDRESS: pcs-host
      # server.ts branches on this — dev mode gives Next.js fast refresh.
      NODE_ENV: development
      # Next.js dev mode binds loopback by default; Caddy needs to reach us.
      HOSTNAME_BIND: "0.0.0.0"
      # Trust the dev CA minted by bootstrap.sh rather than disabling
      # verification wholesale. getDiscovery() and the token exchange are
      # server-to-Caddy over HTTPS, and NODE_TLS_REJECT_UNAUTHORIZED=0 would
      # also mask a genuinely broken chain.
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      # Shared with the gate: verifies the per-request identity assertion, and
      # signs the control tokens that revoke gate sessions. Same value, both
      # services — the app refuses every request if it does not match.
      IDENTITY_ASSERTION_SECRET: ${ADMIN_ASSERTION_SECRET:-dev-admin-gate-secret}
      IDENTITY_ASSERTION_AUDIENCE: "admin"
      APPSHIELD_GATE_URL: "http://admin"
      # Ends Authelia's session at logout, so the next sign-in actually asks for
      # a password instead of being waved through by its 30-day cookie. Fired by
      # the BROWSER (the cookie never reaches this container) as a same-site
      # no-cors POST — see the same knob in template-root's docker-compose.yml.
      UPSTREAM_LOGOUT_URL: "https://local-auth-${DOMAIN}/api/logout"
    volumes:
      - ssh_keys:/host_ssh/
      - admin_data:/app/data/
      - certs:/certs:ro
      # Bind-mounted source for fast refresh. node_modules and .next stay in the
      # image so host artifacts are never pulled in.
      - ../../settings-dashboard/src:/app/settings-dashboard/src
      - ../../settings-dashboard/server.ts:/app/settings-dashboard/server.ts:ro
      - ../../settings-dashboard/config:/app/settings-dashboard/config:ro
      - ../../settings-dashboard/public:/app/settings-dashboard/public:ro
      - ../../settings-dashboard/next.config.mjs:/app/settings-dashboard/next.config.mjs:ro
      - ../../settings-dashboard/tsconfig.json:/app/settings-dashboard/tsconfig.json:ro
    command: ["pnpm", "-C", "settings-dashboard", "start"]
    networks:
      - app-network
    depends_on:
      pcs-host:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # authelia — the PCS-local credential store, and the thing the Account panel
  # administers. users_database.yml lives in the auth_data volume, written by
  # ensure-authelia.sh and mutated by authelia-user-manager.sh over SSH.
  #
  # Served at local-auth-${DOMAIN}, NOT auth-${DOMAIN}: Dex is the broker on
  # `auth-`, Authelia is the connector behind it. AccountPanel derives the
  # "Manage sign-in" link by swapping the `admin-` prefix for `local-auth-`.
  # ---------------------------------------------------------------------------
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset
    volumes:
      - auth_data:/config
    expose:
      - "9091"
    networks:
      - app-network
    depends_on:
      pcs-host:
        condition: service_healthy
    labels:
      caddy_0: local-auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 9091}}"

  # ---------------------------------------------------------------------------
  # dex — OIDC broker. Every PCS app (this dashboard included) delegates login
  # here; Dex federates to Authelia via the "Local Account" connector.
  #
  # SSL_CERT_FILE is load-bearing. Dex opens a back-channel to Authelia's issuer
  # (discovery, token exchange, userinfo) over HTTPS through Caddy, which serves
  # the dev CA's certificate. Without this Dex rejects the chain and the
  # connector fails — bootstrap.sh drops the CA next to the config for exactly
  # this reason. It is the escape hatch the prod compose documents.
  # ---------------------------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.43.1
    container_name: dex
    hostname: dex
    restart: unless-stopped
    command: ["dex", "serve", "/data/config.yaml"]
    environment:
      SSL_CERT_FILE: /data/ca-bundle.crt
    volumes:
      - dex_data:/data
      # Custom login theme, rendered from template-root/root/dex-theme by
      # ensure-dex.sh. Only the theme is overlaid — the stock templates and
      # static assets in the image are left alone, so this needs no subpath
      # gymnastics for login.html/header.html the way prod's file binds do.
      - type: volume
        source: dex_frontend
        target: /srv/dex/web/themes/yundera
        read_only: true
        volume:
          subpath: themes/yundera
    expose:
      - "5556"
    networks:
      app-network: null
      # gRPC client-management API is bound to this static IP in
      # dex.config.yaml.tmpl — only auth-registrar shares the network. Keep the
      # address in sync with that template.
      dex-internal:
        ipv4_address: 172.31.7.2
    depends_on:
      pcs-host:
        condition: service_healthy
      # Dex opens its Authelia connector at STARTUP and exits if that fails.
      # Authelia is reached through Caddy by hostname, and that hostname only
      # resolves to Caddy once Caddy is running and its network alias exists —
      # before that, `local-auth-dev.localhost` falls through to the libc
      # `.localhost` rule and lands on ::1, so Dex dies with "connection
      # refused" and only recovers on its restart policy. Ordering it after
      # Caddy makes a cold boot clean instead of merely self-healing.
      caddy:
        condition: service_started
    labels:
      caddy_0: auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 5556}}"

  # ---------------------------------------------------------------------------
  # auth-registrar — hands out OIDC client_id/secret pairs to apps on first
  # login, over Dex's gRPC API. Stateless: the client cache is in-container and
  # deliberately not persisted, so secrets rotate on restart and apps
  # re-register transparently.
  #
  # `auth-registrar` is a common container name (every PCS stack and the
  # MetaMesh dev stack use it), so run under a dev-prefixed name and advertise
  # the canonical alias on the network only.
  # ---------------------------------------------------------------------------
  auth-registrar:
    image: ghcr.io/yundera/mesh-auth:1.1.3
    container_name: dev-auth-registrar
    hostname: auth-registrar
    restart: unless-stopped
    environment:
      ISSUER_URL: https://auth-${DOMAIN}
      REGISTRAR_BACKEND: dex
      DEX_GRPC_ADDR: 172.31.7.2:5557
      DEX_CLIENTS_DIR: /tmp/dex-clients
      REDIRECT_HOST_SUFFIXES: "${DOMAIN}"
    expose:
      - "9092"
    networks:
      app-network:
        aliases:
          - auth-registrar
      dex-internal: null
    depends_on:
      - dex

  # ---------------------------------------------------------------------------
  # caddy — routes the three hostnames from the `caddy_*` labels above.
  #
  # Serves the dev CA's certificate rather than `tls internal`. That is not
  # cosmetic: Caddy's internal CA is generated lazily on first issuance, which
  # is after Dex has already started and tried its connector, and no ordering
  # fixes that. A cert minted up-front in bootstrap.sh removes the race, and
  # matches prod (which also serves a mounted cert).
  # ---------------------------------------------------------------------------
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.10
    container_name: dev-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_INGRESS_NETWORKS: app-network
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
      PCS_EMAIL: ${EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pcs-host:
        condition: service_healthy
    networks:
      app-network:
        # Server-side calls inside the admin and dex containers resolve these
        # hostnames to Caddy on the internal network. Without the aliases they
        # fall through to public DNS: *.localhost resolves to 127.0.0.1, which
        # is the calling container's own netns — ECONNREFUSED.
        aliases:
          - admin-${DOMAIN}
          - auth-${DOMAIN}
          - local-auth-${DOMAIN}

volumes:
  ssh_keys:
  data:
  auth_data:
  dex_data:
  dex_frontend:
  admin_data:
  # Gate sessions (sessions.json) — so a `docker compose up` that recreates the
  # gate does not sign you out mid-test.
  gate_data:
  certs:
  caddy_data:
  caddy_config:

networks:
  app-network:
    # Pinned so CADDY_INGRESS_NETWORKS can match it (compose would otherwise
    # prefix it as `run_app-network`).
    name: app-network
    driver: bridge
  # Isolated gRPC-only network for auth-registrar <-> Dex client management,
  # mirroring prod. internal: true means no egress.
  dex-internal:
    name: dev-dex-internal
    internal: true
    ipam:
      config:
        - subnet: 172.31.7.0/29
